<script>
  // Only play grid preview videos when they're actually on screen (saves data/battery)
  const previewVideos = document.querySelectorAll(".photo-card video");
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.play().catch(() => {});
      } else {
        entry.target.pause();
      }
    });
  }, { threshold: 0.4 });
  previewVideos.forEach(v => io.observe(v));

  // Lightbox: click to open fullscreen, click again to close.
  // Videos restart from the beginning with sound when opened.
  const lightbox = document.getElementById("lightbox");
  document.querySelectorAll(".photo-card").forEach(card => {
    card.addEventListener("click", () => {
      const src = card.getAttribute("data-full");
      const isVideo = /\.(mp4|webm|mov)$/i.test(src);
      lightbox.innerHTML = isVideo
        ? `<video src="${src}" controls autoplay playsinline></video>`
        : `<img src="${src}" alt="">`;
      requestAnimationFrame(() => lightbox.classList.add("open"));
    });
  });
  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("open");
    setTimeout(() => { lightbox.innerHTML = ""; }, 280);
  });
</script>
