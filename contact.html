<section class="page-hero">
  <div class="wrap">
    <h1>Get in touch</h1>
    <p>Booking, collabs, or just to say hi.</p>
  </div>
</section>

<section class="contact">
  <div class="wrap">
    <form action="https://formspree.io/f/xdekzywy" method="POST">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Send message</button>
      <p class="form-note">Sent straight to Late Noper's inbox.</p>
    </form>
  </div>
</section>

<footer class="wrap">
  <span>© 2026 Late Noper</span>
  <div class="footer-socials">
    <a class="btn-icon" href="https://www.instagram.com/n8mydude" target="_blank" rel="noopener" aria-label="Instagram">
